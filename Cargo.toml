[package]
name = "packages-site"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["zrah <zrah@protonmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8"
axum-macros = "0.5"
axum-extra = { version = "0.12", features = ["typed-routing"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "f8afe99dc92b903d04b4a87bd6cbfcb13b5e615c", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "time"
] }
serde = { version = "^1", features = ["derive"] }
toml = "1.1"
anyhow = "^1"
askama = "0.16"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting", "serde"] }
textwrap = "0.16"
rust-embed = "8"
mime_guess = "^2"
deb-version = "0.1"
serde_json = "^1"
indexmap = { version = "2", features = ["serde"] }
html-escape = "0.2"
abbs-meta-tree = { git = "https://github.com/AoSC-Dev/abbs-meta-rs" }
size = "0.5"
itertools = "0.15"
hex = "0.4"
proc-macro-regex = "^1"
clap = { version = "4.5", features = ["derive"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-client"] }
opentelemetry = "0.32"
tracing-opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
reqwest = "0.13"

[profile.dev.package.askama_derive]
opt-level = 3
 
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
